[package]
name = "dile-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Dile tray application: hold a key, speak, let go."

[lints.rust]
missing_docs = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The version is carried next to the path on purpose: a bare `path` is a wildcard
# requirement, and `deny.toml` refuses those. It tracks `workspace.package.version`.
dile-core = { path = "../dile-core", version = "0.1.0" }
dile-capture = { path = "../dile-capture", version = "0.1.0" }
dile-hotkey = { path = "../dile-hotkey", version = "0.1.0" }
dile-engine-proto = { path = "../dile-engine-proto", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true

# `dile-capture` reports through `log`, so without an implementation none of it is visible.
# Default features are off: the colour and timestamp stacks are four more crates for a line
# that only ever reaches a debug console, since a release build is windowed and has nowhere
# to print.
env_logger = { version = "0.11.6", default-features = false }
log = "0.4.34"

# The probe clip (WP3) is a WAV in `assets/`, and the debug build writes `last.wav` beside
# the application's data so the WP2 hand test has something to listen to. The clip is read
# in every build; the writing is behind `#[cfg(debug_assertions)]` in `session.rs`.
hound = "3.5.1"

# The model downloader. `rustls` rather than the system stack because the one host this
# product ever reaches is `huggingface.co` over HTTPS and a pure-Rust TLS stack needs no
# OpenSSL on the platforms WP7 has to cross-build for. Default features are off: JSON,
# gzip, cookies, charset conversion and SOCKS are all things a `GET` of a 574 MB file with
# a `Range` header does not need.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

# The checksum every downloaded model is verified against before it is renamed into place
# (`docs/PROJECT.md` §3, Distribution: "sha256 embedded in the app").
sha2 = "0.10.9"

# Error types with their message on the variant. Already in the tree through `dile-engine-
# proto`, and the alternative is four hand-written `Display` implementations.
thiserror = "2"

# The first-run consent dialog. No model byte is fetched before a person has said yes, and
# a native dialog is the only surface this application has to ask on until WP5 builds the
# settings window.
tauri-plugin-dialog = "2"

# `tray-icon` is what turns the tray on in Tauri v2 and `image-png` lets the tray take a
# PNG. Both are Tauri's own features, not extra crates.
tauri = { version = "2", features = ["tray-icon", "image-png"] }

# `dile-engine` is deliberately NOT a dependency, and `dile-engine-proto` is the reason it
# does not have to be. The engine runs in `dile-engine-host`, a process of its own, so that
# a Vulkan driver fault takes the engine down and not the tray (docs/PROJECT.md §3); this
# crate links the wire and never the runtime.
# What language Windows is set to, for the "Automatic" row of the language setting. Four
# hundred lines over `windows-sys`, which is already in this tree through Tauri, and the
# alternative in an application that forbids unsafe code is a plugin that brings a JavaScript
# API nothing here would call.
sys-locale = "0.3.0"

# Start with Windows, which is a settings switch (WP5) and a registry value under
# `HKCU\...\Run`. The plugin is the supported way to write it from a Tauri application, and
# it is applied from Rust rather than from the webview: see `capabilities/settings.json`.
tauri-plugin-autostart = "2"

# WP5b: the paste. Four things have no safe wrapper anywhere in the Tauri stack — the
# clipboard with a *delayed render* receipt, the foreground window and the program behind it,
# the monitor that window is on, and a synthetic key chord — and all four are in `src/win32/`,
# which is the only module in this crate where `unsafe` is allowed (`main.rs` says `deny`
# rather than `forbid` for exactly that reason).
#
# The version is Tauri's own: `tauri`, `tao` and `wry` are all on `windows` 0.61, so this
# adds no second copy of a crate that is already compiled into the binary. `arboard` was
# evaluated for the clipboard half and cannot do delayed rendering — see
# `src/win32/clipboard.rs`, which is where the decision is written down.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
