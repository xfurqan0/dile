[workspace]
members = [
    "crates/dile-core",
    "crates/dile-engine",
    "crates/dile-engine-proto",
    "crates/dile-engine-host",
    "crates/dile-client",
    "crates/dile-cli",
    "crates/dile-hotkey",
    "crates/dile-capture",
    "crates/dile-app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.85 is what edition 2024 needs; 1.88 is what the dependency tree needs. `time` 0.3.47 and
# `plist` 1.10.1 are the versions that carry the fixes for RUSTSEC-2026-0009 and
# RUSTSEC-2026-0194/0195, and both declare 1.88. Taking a security fix and then declaring an
# MSRV the fixed tree cannot build under would be a lie in the manifest.
rust-version = "1.88"
license = "MIT"
# The name **and** the address, because one of them is a package field rather than a
# courtesy: `Maintainer:` in a Debian control file is expected to carry an email, and
# `tauri-bundler` takes it from here and nowhere else. Nothing else in the workspace reads
# `CARGO_PKG_AUTHORS`, so the Windows installer is untouched by the addition.
authors = ["Furkan Yıldız <xfurqan0@users.noreply.github.com>"]
repository = "https://github.com/xfurqan0/dile"
homepage = "https://github.com/xfurqan0/dile"
description = "Hold a key, speak, let go. Local, Turkish-first push-to-talk dictation."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
