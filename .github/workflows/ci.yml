name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. Everything that decides whether a change is correct runs here, and none of it
  # needs the bundler: the Tauri bundler is the fragile part of a Windows pipeline (WebView2,
  # NSIS, signing) and a bundler problem must never make a correct change look broken. The
  # installer becomes a gate in WP7, when it is the product rather than a by-product.
  windows:
    name: Windows — lint, test, build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The expensive artefact in this workspace is transcribe.cpp: `transcribe-cpp-sys`
      # builds a C++ library from source through CMake, which is about two minutes cold and
      # nothing warm. Caching it is the difference between a 12-minute run and a 4-minute one.
      - uses: Swatinem/rust-cache@v2

      # CMake is already on the windows-latest image, and the build needs nothing else. This
      # step exists to fail loudly with the version if a future image drops it, rather than
      # leaving a maintainer to read a CMake error from inside a build script.
      - name: Check CMake is present
        run: cmake --version

      # `bundle.externalBin` is checked by `tauri-build`, so both sidecars have to be on disk
      # before anything compiles `dile-app` — clippy and `cargo test` included, not only the
      # bundler. A missing one fails with "resource path
      # binaries\dile-engine-host-x86_64-pc-windows-msvc.exe doesn't exist", which is the
      # right failure and the wrong time to meet it.
      #
      # CPU-only and debug: the Vulkan SDK is a ~250 MB download and an installer, for a
      # feature a runner with no GPU could not exercise anyway. What this proves is that the
      # configuration is exercised on every pull request; that the GPU host builds is
      # `release.yml`'s job, and the maintainer's.
      - name: Prepare the sidecars
        shell: pwsh
        run: ./scripts/build-host.ps1 -Cpu -DebugBuild

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # CPU features only, and that covers `dile-engine-host` as well as `dile-engine`: the
      # `gpu-vulkan` feature is deliberately NOT built here, because it needs the Vulkan SDK
      # — a ~250 MB download and an installer on every run — for a tier that a runner with no
      # GPU could not exercise anyway. Every test that would need a GPU, a network or a real
      # model is `#[ignore]`d; the resume test runs against a server it starts itself. The
      # maintainer builds the GPU host locally before every release — docs/BUILDING.md has
      # the recipe, including the `LIB` variable the SDK installer does not set — and
      # `release.yml` installs the SDK on the runner for the one build that ships.
      - name: Test the workspace
        run: cargo test --workspace

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # Proves the tray application links and its Tauri context expands: `generate_context!`
      # reads tauri.conf.json, the capability files and ui/ at compile time, so a broken
      # config fails here rather than at bundle time. `--no-bundle` stays after WP7: the
      # bundler is the fragile part of a Windows pipeline (WebView2, NSIS, signing) and a
      # bundler problem must not make a correct change look broken. `release.yml` is where the
      # installer is a gate, on a tag, with the Vulkan SDK installed.
      - name: Build the tray application
        run: cargo tauri build --debug --no-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: dile-debug-windows
          path: target/debug/dile-app.exe
          if-no-files-found: error
          retention-days: 14

  # The same gate, on the platform the port is being built for. Not a smoke test: it runs the
  # whole suite, because the point of the Linux job is the several hundred assertions that had
  # never been evaluated anywhere but Windows — one of which was wrong the first time it ran
  # here, and was about paths rather than about Linux (`paste.rs`, the fixture helper).
  #
  # `ubuntu-22.04` rather than `ubuntu-latest`, and deliberately: a binary built against an
  # older glibc runs on the newer distributions as well, and the reverse is not true. A job
  # that proves the build on the newest image only proves it for the newest image.
  linux:
    name: Linux — lint, test, build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Tauri v2's own list, plus one. `libasound2-dev` is the extra and it is not optional:
      # `alsa-sys` looks `alsa.pc` up through pkg-config and has no vendored source, so
      # `dile-capture` does not compile without it — and cpal needs ALSA even where PipeWire
      # or PulseAudio is what actually serves the stream.
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libasound2-dev

      - name: Check CMake is present
        run: cmake --version

      # The same sidecar rule as on Windows, for the same reason: `tauri-build` checks
      # `bundle.externalBin` in its build script, so a missing one fails clippy and the tests
      # and not only the bundler. `--cpu` skips the Vulkan loader, the headers and glslc,
      # which a runner with no GPU could not exercise anyway.
      - name: Prepare the sidecars
        run: ./scripts/build-host.sh --cpu --debug

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test the workspace
        run: cargo test --workspace

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # `--no-bundle` for the same reason as on Windows: what this proves is that the
      # application links and that `generate_context!` expands, and a bundler problem must not
      # make a correct change look broken. The `deb` and `rpm` targets are declared in
      # `tauri.linux.conf.json`, which the CLI merges over `tauri.conf.json` on this platform.
      - name: Build the tray application
        run: cargo tauri build --debug --no-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: dile-debug-linux
          path: target/debug/dile-app
          if-no-files-found: error
          retention-days: 14

  # Licences, advisories, duplicate versions and unexpected sources, from deny.toml. On Linux
  # because it resolves the dependency graph rather than building it, and because it must not
  # add minutes to the job that decides whether the code is correct.
  #
  # An advisory published against a crate deep in the Tauri tree can turn this red on a day
  # nothing changed here. That is the point of it — but the fix is an entry in
  # `[advisories] ignore` with the reason written beside it, never deleting the job.
  audit:
    name: Dependencies — licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check
