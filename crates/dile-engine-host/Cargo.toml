[package]
name = "dile-engine-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The isolated process Dile runs its speech engine in."

[lints.rust]
missing_docs = "warn"

[dependencies]
# The version is carried next to the path because a bare `path` is a wildcard requirement
# and `deny.toml` refuses those. Both track `workspace.package.version`.
dile-engine = { path = "../dile-engine", version = "0.1.0" }
dile-engine-proto = { path = "../dile-engine-proto", version = "0.1.0" }

[features]
default = []
# Mirrors `dile-engine`'s feature of the same name so that one `--features gpu-vulkan` on
# this binary is the whole GPU build. Needs the Vulkan SDK and the `LIB` variable its
# installer does not set — docs/BUILDING.md.
gpu-vulkan = ["dile-engine/gpu-vulkan"]
